Section "Monitor"
    Identifier "HDMI-1"
    Option "PreferredMode" "1920x1200"
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device "Rockchip Graphics"
    Monitor "HDMI-1"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1200"
    EndSubSection
EndSection
