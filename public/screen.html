<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滚动大屏</title>
  <link rel="stylesheet" href="/screen.css" />
</head>
<body>
  <main class="screen-grid">
    <section class="panel panel-slot" data-slot="1">
      <div class="panel-title">看板 1</div>
      <div id="panelContent1" class="panel-content"></div>
    </section>

    <section class="panel panel-slot" data-slot="2">
      <div class="panel-title">看板 2</div>
      <div id="panelContent2" class="panel-content"></div>
    </section>

    <section class="panel panel-slot" data-slot="3">
      <div class="panel-title">看板 3</div>
      <div id="panelContent3" class="panel-content"></div>
    </section>

    <section class="panel panel-slot" data-slot="4">
      <div class="panel-title">看板 4</div>
      <div id="panelContent4" class="panel-content"></div>
    </section>
  </main>

  <script src="/screen.js"></script>
</body>
</html>
